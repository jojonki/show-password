<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="shot.css">
<style>
  .cards { flex: 1; display: grid; grid-template-columns: 1fr; gap: 22px; }
  .card {
    background: #fff; border-radius: 14px; padding: 28px 32px; display: flex; gap: 24px; align-items: center;
    box-shadow: 0 12px 36px rgba(30,50,120,.10), 0 1px 4px rgba(30,50,120,.06);
  }
  .card .ic {
    flex: 0 0 64px; height: 64px; border-radius: 16px; background: #E3EBFF;
    display: flex; align-items: center; justify-content: center;
  }
  .card h3 { margin: 0 0 6px; font-size: 24px; }
  .card p { margin: 0; font-size: 17px; color: #4A5272; line-height: 1.6; }
</style></head>
<body>
<div class="stage">
  <div class="copy">
    <div class="badge"><img src="../../icons/icon128.png" alt="">Show Password on Hover</div>
    <h1>軽くて、<br>安心な設計</h1>
    <p>わずか 20 行ほどのシンプルなコード。<br>あなたのパスワードは<em>どこにも送られません</em>。</p>
  </div>
  <div class="cards">
    <div class="card">
      <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2A4FD6" stroke-width="2" stroke-linecap="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div><h3>追加の権限なし</h3><p>タブ・履歴・ストレージなどの権限を一切要求しません。</p></div>
    </div>
    <div class="card">
      <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2A4FD6" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0116 0"/><path d="M4 4l16 16"/><circle cx="12" cy="16" r="2"/></svg></div>
      <div><h3>通信なし</h3><p>外部サーバーへの送信はゼロ。すべてページ内で完結します。</p></div>
    </div>
    <div class="card">
      <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2A4FD6" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 4l16 16"/></svg></div>
      <div><h3>保存なし</h3><p>入力内容を記録・保存することはありません。</p></div>
    </div>
  </div>
</div>
</body></html>
