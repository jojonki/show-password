<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", -apple-system, sans-serif; color: #fff;
    background: linear-gradient(135deg, #4F7BFF 0%, #2A4FD6 100%);
    display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box;
  }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .row img { width: 64px; height: 64px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.18)); }
  .name { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .field {
    background: #fff; color: #1B2240; border-radius: 10px; height: 46px;
    display: flex; align-items: center; padding: 0 16px; font-size: 18px; font-weight: 600;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
  }
  .field .dots { color: #9AA1BC; letter-spacing: 2px; margin-right: 10px; }
  .sub { margin-top: 16px; font-size: 15px; opacity: .92; }
</style></head>
<body>
  <div class="row"><img src="../../icons/icon128.png" alt=""><div class="name">Show Password<br>on Hover</div></div>
  <div class="field"><span class="dots">●●●●</span>→&nbsp; Sunflower-2026!</div>
  <div class="sub">マウスを乗せるだけでパスワードを確認</div>
</body></html>
